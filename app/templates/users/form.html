{% extends "base.html" %}
{% block title %}Add user{% endblock %}
{% block content %}
  <div class="page-head"><h1>Add user</h1></div>
  <form method="post" class="card narrow">
    <div class="form-row"><label for="username">Username</label>
      <input id="username" name="username" required minlength="3" maxlength="40" value="{{ item.username or '' }}"></div>
    <div class="form-row"><label for="password">Password (6+ characters)</label>
      <input id="password" name="password" type="password" required minlength="6"></div>
    <div class="form-row"><label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="STAFF" {{ 'selected' if item.role == 'STAFF' }}>STAFF</option>
        <option value="ADMIN" {{ 'selected' if item.role == 'ADMIN' }}>ADMIN</option>
      </select></div>
    <div class="actions"><button class="btn btn-primary">Save</button>
      <a class="btn" href="{{ url_for('auth.users') }}">Back</a></div>
  </form>
{% endblock %}
