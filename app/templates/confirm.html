{% extends "base.html" %}
{% block title %}Are you sure?{% endblock %}
{% block content %}
  <div class="card narrow">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {# No action attribute: the form posts back to this same URL #}
    <form method="post" class="actions">
      <button class="btn {{ 'btn-danger' if danger else 'btn-primary' }}">{{ button }}</button>
      <a class="btn" href="{{ back_url }}">Go back</a>
    </form>
  </div>
{% endblock %}
