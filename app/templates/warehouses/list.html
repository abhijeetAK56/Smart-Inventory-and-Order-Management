{% extends "base.html" %}
{% block title %}Warehouses{% endblock %}
{% block content %}
  <div class="page-head"><h1>Warehouses</h1>
    <a class="btn btn-primary" href="{{ url_for('masters.warehouse_form') }}">Add warehouse</a></div>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Name</th><th>City</th><th class="num">Units on hand</th><th></th></tr></thead>
    <tbody>
    {% for w in warehouses %}
      <tr><td>{{ w.name }}</td><td>{{ w.city }}</td><td class="num">{{ w.units_on_hand }}</td>
        <td><a href="{{ url_for('masters.warehouse_form', warehouse_id=w.warehouse_id) }}">Edit</a></td></tr>
    {% else %}<tr><td colspan="4" class="empty">No warehouses yet.</td></tr>{% endfor %}
    </tbody>
  </table></div>
{% endblock %}
