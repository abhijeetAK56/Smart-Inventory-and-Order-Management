{% extends "base.html" %}
{% block title %}Warehouse{% endblock %}
{% block content %}
  <div class="page-head"><h1>{{ 'Edit' if warehouse_id else 'Add' }} warehouse</h1></div>
  <form method="post" class="card narrow">
    <div class="form-row"><label for="name">Name</label>
      <input id="name" name="name" required maxlength="60" value="{{ item.name or '' }}"></div>
    <div class="form-row"><label for="city">City</label>
      <input id="city" name="city" required maxlength="60" value="{{ item.city or '' }}"></div>
    <div class="actions"><button class="btn btn-primary">Save</button>
      <a class="btn" href="{{ url_for('masters.warehouses') }}">Back</a></div>
  </form>
{% endblock %}
