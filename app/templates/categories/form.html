{% extends "base.html" %}
{% block title %}Category{% endblock %}
{% block content %}
  <div class="page-head"><h1>{{ 'Edit' if category_id else 'Add' }} category</h1></div>
  <form method="post" class="card narrow">
    <div class="form-row"><label for="name">Name</label>
      <input id="name" name="name" required maxlength="60" value="{{ item.name or '' }}"></div>
    <div class="form-row"><label for="description">Description</label>
      <input id="description" name="description" maxlength="255" value="{{ item.description or '' }}"></div>
    <div class="actions"><button class="btn btn-primary">Save</button>
      <a class="btn" href="{{ url_for('masters.categories') }}">Back</a></div>
  </form>
{% endblock %}
